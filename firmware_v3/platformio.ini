; PlatformIO configuration for firmware_v3 (pico-sdk)
;
; Requires PlatformIO Core and the RP2040 fork platform:
;   platform = https://github.com/maxgerhardt/platform-raspberrypi.git
;
; Usage:
;   pio run -e pico_picosdk
;   pio run -t upload -e pico_picosdk

[env:pico_picosdk]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = picosdk
extra_scripts = pre:platformio_picosdk_tinyusb.py

; Ensure Pico SDK board selection is explicit.
board_build.picosdk.board_header = pico.h

; Remove size-oriented optimization from platform defaults.
build_unflags =
    -Os

; Speed-focused flags and minimal runtime features.
build_flags =
    -DPIO_STDIO_NONE
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -DCPU_CLOCK_KHZ=200000u
    -DMAX_FRAME_UPDATE_FPS=60u
    -DNDEBUG
    -Ofast
    -mcpu=cortex-m0plus
    -mthumb
    -fomit-frame-pointer
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -I.
    -Isrc

upload_protocol = picotool
monitor_speed = 115200

[env:pico_picosdk_debugsafe]
extends = env:pico_picosdk

build_unflags =
    ${env:pico_picosdk.build_unflags}
    -Ofast
    -DNDEBUG

build_flags =
    ${env:pico_picosdk.build_flags}
    -O2
    -g3
    -fstack-protector-strong
    -fno-strict-aliasing
    -Wall
    -Wextra
    -Wformat=2
    -Wshadow
    -Wdouble-promotion
    -Wnull-dereference
    -Werror=implicit-function-declaration
    -Werror=incompatible-pointer-types

[env:pico_picosdk_fastcheck]
extends = env:pico_picosdk

build_flags =
    ${env:pico_picosdk.build_flags}
    -Warray-bounds=2
    -Wstringop-overflow=2
    -Wstrict-overflow=2
    -Wrestrict
    -Wnull-dereference
